<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Muhammed Sheheen M T P — AI/ML Engineer</title>
  <desc id="description">A dark blue portfolio preview with neural network lines and AI engineering specialties.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050916"/>
      <stop offset="0.55" stop-color="#081329"/>
      <stop offset="1" stop-color="#11133a"/>
